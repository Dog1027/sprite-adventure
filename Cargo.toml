[package]
name = "sprite"
version = "0.1.0"
edition = "2024"

[dependencies]
macroquad = "0.4.16"
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
