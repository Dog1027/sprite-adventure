# 精靈種類資料：每一段是一種精靈，段名是代號（species::create 用），name 是顯示的名稱。
# 名稱與數值為第一版，平衡之後再調。規則見 docs/DESIGN.md「精靈」「回合與攻擊節奏」「能力值」「技能」。
#
# name        顯示名稱（戰鬥畫面一格約放得下 2 個字）
# rarity      稀有度：common 普通／uncommon 少見／rare 稀有，影響出現機率（見 src/sprite/generate.rs）
# starter     true 表示開局的精靈，全部只能有一種（可省略）
#
# hp          HP，歸零就退場（至少 1）
# attack      攻擊
# defense     防禦
# interval    每幾回合攻擊一次（至少 1）
# start_turn  第幾回合開始攻擊，從 1 起算（至少 1）
# skill_every 每幾次攻擊有一次改用技能（至少 1）
#
# skill       每隻精靈一種技能
#   name      技能名稱
#   range     範圍：single 單體／row 貫穿整列／front 前排／snipe 狙擊後方／all 全體／heal 治療
#   power     倍率（%）：傷害技能為攻擊的百分比；治療量 = 攻擊 × 倍率
#
# catch_rate  在捕捉節點的基本捕捉機率（0～100%）

# ── 普通 ──

# 開局精靈：攻守平均，技能單體重擊
[ember_fox]
name = "焰狐"
rarity = "common"
starter = true
hp = 100
attack = 30
defense = 15
interval = 1
start_turn = 1
skill_every = 3
skill = { name = "狐火", range = "single", power = 180 }
catch_rate = 55

# 坦克：血厚防高，技能打敵方最前排
