# 精靈種類資料：每一段是一種精靈，段名就是 species::create 用的名稱。
# 名稱與數值僅為示意。規則見 docs/DESIGN.md「回合與攻擊節奏」「能力值」。
#
# hp          HP，歸零就退場（至少 1）
# attack      攻擊
# defense     防禦
# interval    每幾回合攻擊一次（至少 1）
# start_turn  第幾回合開始攻擊，從 1 起算（至少 1）
# skill_every 每幾次攻擊有一次改用技能（至少 1）
#
# skill       每隻精靈一種技能（見 docs/DESIGN.md「技能」）
#   name      技能名稱
#   range     範圍：single 單體／row 貫穿整列／front 前排／snipe 狙擊後方／all 全體／heal 治療
#   power     倍率（%）：傷害技能為攻擊的百分比；治療量 = 攻擊 × 倍率
#
# catch_rate  在捕捉節點的基本捕捉機率（0～100%，見 docs/DESIGN.md「捕捉」）

